async function loadUsers() {
  try {
    const res = await fetch('/api/users');
    const data = await res.json();
    const tbody = document.getElementById('users-table-body');
    
    if (!data.success || !data.data || data.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-400">لا يوجد مستخدمين</td></tr>`;
      return;
    }

    tbody.innerHTML = data.data.map(user => {
      const roleColors = {
        'مدير': 'bg-purple-100 text-purple-700',
        'تسجيل الطلاب': 'bg-blue-100 text-blue-700',
        'التقارير': 'bg-green-100 text-green-700',
        'الشؤون المالية': 'bg-amber-100 text-amber-700',
        'مخصص': 'bg-slate-100 text-slate-700'
      };
      const roleColor = roleColors[user.role] || 'bg-slate-100 text-slate-700';
      const statusBadge = user.status === 'active' 
        ? '<span class="status-badge status-active">نشط</span>'
        : '<span class="status-badge status-inactive">موقوف</span>';
      
      return `
        <tr class="hover:bg-slate-50/80 transition-colors">
          <td class="px-4 md:px-6 py-4 font-semibold text-slate-800">${user.name}</td>
          <td class="px-4 md:px-6 py-4 text-slate-600">${user.email}</td>
          <td class="px-4 md:px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${roleColor}">${user.role}</span></td>
          <td class="px-4 md:px-6 py-4 text-slate-600">${user.phone || '-'}</td>
          <td class="px-4 md:px-6 py-4">${statusBadge}</td>
          <td class="px-4 md:px-6 py-4 whitespace-nowrap">
            <button onclick="openUserModal(${user.id})" class="btn-action btn-edit" title="تعديل">✏️</button>
            ${user.id !== currentUser.id ? `<button onclick="deleteUser(${user.id}, '${user.name}')" class="btn-action btn-delete" title="حذف">🗑️</button>` : ''}
          </td>
        </tr>`;
    }).join('');
  } catch (err) {
    document.getElementById('users-table-body').innerHTML = `<tr><td colspan="6" class="text-center py-12 text-red-500">❌ خطأ في الاتصال</td></tr>`;
  }
}

function openUserModal(userId = null) {
  currentEditId = userId;
  document.getElementById('modal-title').textContent = userId ? 'تعديل مستخدم' : 'إضافة مستخدم جديد';
  
  let user = { name: '', email: '', password: '', role: 'مخصص', phone: '', allowed_menus: [] };
  
  if (userId) {
    // جلب بيانات المستخدم
    fetch('/api/users').then(r => r.json()).then(data => {
      if (data.success) {
        user = data.data.find(u => u.id === userId) || user;
        user.allowed_menus = JSON.parse(user.allowed_menus || '[]');
        renderUserForm(user);
      }
    });
  } else {
    renderUserForm(user);
  }
}

          </select>

    </div>
    <div class="flex flex-col sm:flex-row gap-3 mt-6">

      <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition-colors">إلغاء</button>

function toggleCustomMenus() {
  const role = document.getElementById('user-role-select').value;
  const section = document.getElementById('custom-menus-section');
  section.style.display = role === 'مخصص' ? 'block' : 'none';
}

document.getElementById('modal-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const data = {
    name: formData.get('name'),
    email: formData.get('email'),
    phone: formData.get('phone'),
    role: formData.get('role'),
    status: formData.get('status') || 'active'
  };
  
  const password = formData.get('password');
  if (password) data.password = password;
  
  // جمع القوائم المسموحة
  const allowedMenus = Array.from(document.querySelectorAll('input[name="allowed_menus"]:checked')).map(cb => cb.value);
  data.allowed_menus = allowedMenus;
  
  const method = currentEditId ? 'PUT' : 'POST';
  const url = currentEditId ? `/api/users/${currentEditId}` : '/api/users';
  
  try {
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const result = await res.json();
    if (result.success) {
      showToast(currentEditId ? '✅ تم تعديل المستخدم بنجاح' : '✅ تمت إضافة المستخدم بنجاح');
      closeModal();
      loadUsers();
    } else {
      showToast('❌ ' + result.message, 'error');
    }
  } catch (err) {
    showToast('❌ خطأ في الاتصال', 'error');
  }
});

async function deleteUser(id, name) {
  if (!confirm(`هل أنت متأكد من حذف المستخدم "${name}"؟`)) return;
  try {
    const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
    const result = await res.json();
    if (result.success) {
      showToast('🗑️ تم حذف المستخدم بنجاح');
      loadUsers();
    } else {
      showToast('❌ ' + result.message, 'error');
    }
  } catch (err) {
    showToast('❌ خطأ في الحذف', 'error');
  }
}
    function buildSidebar() {
  document.getElementById('user-name').textContent = currentUser.name;
  document.getElementById('user-role').textContent = currentUser.role;
  
  const nav = document.getElementById('sidebar-nav');
  let items = [];
  
  // إذا كان المستخدم أدمن، يرى كل القوائم
  if (currentUser.role === 'مدير') {
    items = menuItems['مدير'];
  }
  // إذا كان الدور محدد مسبقاً
  else if (menuItems[currentUser.role]) {
    items = menuItems[currentUser.role];
  }
  // إذا كان مخصص، نستخدم allowed_menus
  else if (currentUser.role === 'مخصص' && currentUser.allowed_menus) {
    items = allMenus.filter(m => currentUser.allowed_menus.includes(m.id));
  }
  
  // التأكد من وجود لوحة التحكم دائماً
  if (!items.find(m => m.id === 'dashboard')) {
    items.unshift({id:'dashboard', icon:'📊', label:'لوحة التحكم'});
  }
  
  nav.innerHTML = items.map((item, i) => 
    `<a onclick="showPage('${item.id}'); if(window.innerWidth < 768) toggleSidebar();" class="nav-item ${i===0?'active':''} flex items-center px-4 py-3 rounded-xl text-slate-300 hover:text-white">
      <span class="ml-3 text-lg">${item.icon}</span> <span class="font-medium">${item.label}</span>
    </a>`
  ).join('');
}
    function showPage(pageId) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const activeLink = Array.from(document.querySelectorAll('.nav-item')).find(a => a.textContent.includes(
        (menuItems[userRole] || menuItems['مدير']).find(m => m.id === pageId)?.label || ''
      ));
      if (activeLink) activeLink.classList.add('active');

      const contentDiv = document.getElementById('main-content');
      const titles = {dashboard:'لوحة التحكم', reports:'التقارير', certificates:'الشهادات'};
      document.getElementById('page-title').textContent = titles[pageId] || tableConfigs[pageId]?.title || '';

      if (pageId === 'dashboard') renderDashboard();
      else if (pageId === 'reports') renderReports();
      else if (pageId === 'certificates') renderCertificates();
      else if (tableConfigs[pageId]) {
        currentTable = pageId;
        const config = tableConfigs[pageId];
        const actualTable = config.table || pageId;
        contentDiv.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
              <h3 class="text-lg font-bold text-slate-800">إدارة ${config.title}</h3>
              ${!config.noAdd ? `<button onclick="openModal()" class="btn-primary flex items-center justify-center gap-2 text-sm w-full sm:w-auto">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> إضافة جديد
              </button>` : ''}
            </div>
            <div class="overflow-x-auto -mx-4 md:mx-0">
              <table class="w-full text-sm min-w-[600px]">
                <thead class="bg-slate-50 border-b border-slate-100"><tr>
                  ${config.columns.map(c => `<th class="px-4 md:px-6 py-3 text-right font-semibold text-slate-600 whitespace-nowrap">${c.label}</th>`).join('')}
                  <th class="px-4 md:px-6 py-3 text-right font-semibold text-slate-600 whitespace-nowrap">الإجراءات</th>
                </tr></thead>
                <tbody id="dynamic-table-body" class="divide-y divide-slate-100">
                  <tr><td colspan="100" class="text-center py-12 text-slate-400">جاري التحميل...</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
        loadData(actualTable);
      }
    }

    async function renderDashboard() {
      const contentDiv = document.getElementById('main-content');
      contentDiv.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl flex-shrink-0">👥</div>
            <div><p class="text-slate-500 text-xs font-medium">الطلاب</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-students">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl flex-shrink-0">👨‍🏫</div>
            <div><p class="text-slate-500 text-xs font-medium">المعلمون</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-teachers">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl flex-shrink-0">💵</div>
            <div><p class="text-slate-500 text-xs font-medium">الإيرادات</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-revenue">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl flex-shrink-0">📅</div>
            <div><p class="text-slate-500 text-xs font-medium">الحضور</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-attendance">...</p></div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-pink-50 text-pink-600 flex items-center justify-center text-xl flex-shrink-0">👔</div>
            <div><p class="text-slate-500 text-xs font-medium">الموظفون</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-employees">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl flex-shrink-0">💸</div>
            <div><p class="text-slate-500 text-xs font-medium">المصروفات</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-expenses">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-orange-50 text-orange-600 flex items-center justify-center text-xl flex-shrink-0">🚌</div>
            <div><p class="text-slate-500 text-xs font-medium">الباصات</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-transport">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4 hover:shadow-md transition-shadow">
            <div class="w-12 h-12 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-xl flex-shrink-0">📖</div>
            <div><p class="text-slate-500 text-xs font-medium">الكتب</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-library">...</p></div>
          </div>
        </div>`;
      
      const stats = [
        {table:'students', id:'dash-students', type:'count'},
        {table:'teachers', id:'dash-teachers', type:'count'},
        {table:'employees', id:'dash-employees', type:'count'},
        {table:'revenue', id:'dash-revenue', type:'sum', key:'amount'},
        {table:'expenses', id:'dash-expenses', type:'sum', key:'amount'},
        {table:'attendance', id:'dash-attendance', type:'count'},
        {table:'transport', id:'dash-transport', type:'count'},
        {table:'library', id:'dash-library', type:'count'}
      ];
      
      for (const s of stats) {
        try {
          const res = await fetch(`/api/${s.table}`);
          const data = await res.json();
          const el = document.getElementById(s.id);
          if (el && data.success) {
            if (s.type === 'sum') {
              const total = data.data.reduce((sum, item) => sum + (Number(item[s.key]) || 0), 0);
              el.textContent = total.toLocaleString() + ' ج';
            } else {
              el.textContent = data.count;
            }
          }
        } catch(e) {}
      }
    }

    function renderReports() {
      const reports = [
        {url:'/api/reports/students', icon:'👥', title:'تقرير الطلاب', color:'from-indigo-500 to-blue-600'},
        {url:'/api/reports/teachers', icon:'👨‍🏫', title:'تقرير المعلمين', color:'from-emerald-500 to-teal-600'},
        {url:'/api/reports/employees', icon:'👔', title:'تقرير الموظفين', color:'from-violet-500 to-purple-600'},
        {url:'/api/reports/attendance', icon:'📅', title:'تقرير الحضور', color:'from-rose-500 to-pink-600'},
        {url:'/api/reports/grades', icon:'🎯', title:'كشوف الدرجات', color:'from-amber-500 to-orange-600'},
        {url:'/api/reports/fees', icon:'💰', title:'التقرير المالي', color:'from-cyan-500 to-blue-600'},
        {url:'/api/reports/financial', icon:'💵', title:'التقرير الشامل', color:'from-slate-600 to-slate-800'},
        {url:'/api/reports/transport', icon:'🚌', title:'تقرير النقل', color:'from-teal-500 to-cyan-600'},
        {url:'/api/reports/schedules', icon:'🕐', title:'جدول الحصص', color:'from-red-500 to-rose-600'}
      ];
      document.getElementById('main-content').innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-8">
          <h3 class="text-lg font-bold text-slate-800 mb-6">📄 التقارير المتاحة للطباعة</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${reports.map(r => `
              <a href="${r.url}" target="_blank" class="group bg-gradient-to-br ${r.color} text-white p-5 rounded-2xl hover:shadow-lg transition-all duration-300 hover:-translate-y-1 flex items-center gap-4">
                <span class="text-4xl group-hover:scale-110 transition-transform">${r.icon}</span>
                <div><h4 class="font-bold text-base">${r.title}</h4><p class="text-xs opacity-90 mt-1">عرض وطباعة</p></div>
              </a>
            `).join('')}
          </div>
        </div>`;
    }

    async function renderCertificates() {
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        if (!data.success) {
          document.getElementById('main-content').innerHTML = '<div class="bg-red-50 border border-red-100 p-6 rounded-2xl text-red-600 font-semibold">⛔ ' + data.message + '</div>';
          return;
        }
        document.getElementById('main-content').innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-8">
            <h3 class="text-lg font-bold text-slate-800 mb-6">🎓 شهادات الطلاب</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${data.data.length ? data.data.map(s => `
                <a href="/certificate/${s.id}" target="_blank" class="group bg-gradient-to-br from-slate-800 to-slate-900 text-white p-5 rounded-2xl hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                  <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-2xl flex-shrink-0">🎓</div>
                    <div class="overflow-hidden"><h4 class="font-bold text-base truncate">${s.name}</h4><p class="text-xs text-slate-300">${s.grade} - ${s.section}</p></div>
                  </div>
                  <div class="mt-4 bg-white text-slate-900 px-4 py-2.5 rounded-xl text-sm font-bold text-center group-hover:bg-indigo-50 transition-colors">عرض الشهادة</div>
                </a>
              `).join('') : '<p class="text-slate-400 col-span-3 text-center py-12">لا يوجد طلاب</p>'}
            </div>
          </div>`;
      } catch(e) {
        document.getElementById('main-content').innerHTML = '<div class="bg-red-50 border border-red-100 p-6 rounded-2xl text-red-600 font-semibold">❌ خطأ في الاتصال</div>';
      }
    }

    async function loadData(table) {
      try {
        const res = await fetch(`/api/${table}`);
        const data = await res.json();
        const tbody = document.getElementById('dynamic-table-body');
        if (!tbody) return;
        
        if (!data.success) {
          tbody.innerHTML = `<tr><td colspan="100" class="text-center py-12 text-red-500 font-semibold">⛔ ${data.message}</td></tr>`;
          return;
        }

        const config = tableConfigs[currentTable];
        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="100" class="text-center py-12 text-slate-400">لا توجد بيانات</td></tr>`;
          return;
        }

        tbody.innerHTML = data.data.map(row => `
          <tr class="hover:bg-slate-50/80 transition-colors">
            ${config.columns.map(c => {
              let val = row[c.key] || '-';
              if (c.key === 'status') {
                if (val === 'نشط' || val === 'paid' || val === 'present') val = `<span class="status-badge status-active">${val === 'نشط' ? 'نشط' : (val === 'paid' ? 'مدفوع' : 'حاضر')}</span>`;
                else if (val === 'متوقف' || val === 'unpaid' || val === 'absent') val = `<span class="status-badge status-inactive">${val === 'متوقف' ? 'متوقف' : (val === 'unpaid' ? 'غير مدفوع' : 'غائب')}</span>`;
                else if (val === 'late') val = `<span class="status-badge status-partial">متأخر</span>`;
                else if (val === 'partial') val = `<span class="status-badge status-partial">جزئي</span>`;
              }
              return `<td class="px-4 md:px-6 py-4 text-slate-700 font-medium whitespace-nowrap">${val}</td>`;
            }).join('')}
            <td class="px-4 md:px-6 py-4 whitespace-nowrap">
              ${!config.noAdd ? `
                <button onclick="editItem('${table}', ${row.id})" class="btn-action btn-edit" title="تعديل">✏️</button>
                <button onclick="deleteItem('${table}', ${row.id}, '${(row.name || row.student_name || row.book_title || row.bus_name || row.source || row.category || 'هذا السجل').replace(/'/g, "\\'")}')" class="btn-action btn-delete" title="حذف">🗑️</button>
              ` : '<span class="text-slate-400 text-xs">سجل نظام</span>'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        const tbody = document.getElementById('dynamic-table-body');
        if (tbody) tbody.innerHTML = `<tr><td colspan="100" class="text-center py-12 text-red-500 font-semibold">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    function openModal(editData = null) {
      const config = tableConfigs[currentTable];
      document.getElementById('modal-title').textContent = editData ? `تعديل: ${config.title}` : `إضافة: ${config.title}`;
      currentEditId = editData ? editData.id : null;
      
      document.getElementById('modal-form').innerHTML = config.form.map(f => {
        const val = editData ? (editData[f.name] || '') : '';
        if (f.type === 'select') {
          return `<label class="block text-sm font-semibold text-slate-700 mb-1.5">${f.label}</label>
                  <select name="${f.name}" class="form-input">${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
        }
        return `<label class="block text-sm font-semibold text-slate-700 mb-1.5">${f.label}</label>
                <input type="${f.type}" name="${f.name}" value="${val}" class="form-input" placeholder="أدخل ${f.label}">`;
      }).join('') + `<div class="flex flex-col sm:flex-row gap-3 mt-6">
        <button type="submit" class="btn-primary py-3 text-base flex-1">💾 حفظ البيانات</button>
        <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition-colors">إلغاء</button>
      </div>`;
      
      document.getElementById('modal').classList.add('show');
    }

    async function editItem(table, id) {
      try {
        const actualTable = tableConfigs[table].table || table;
        const res = await fetch(`/api/${actualTable}`);
        const data = await res.json();
        const item = data.data.find(r => r.id === id);
        if (item) openModal(item);
      } catch(e) { showToast('❌ خطأ في تحميل البيانات', 'error'); }
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {}; formData.forEach((v, k) => data[k] = v);
      
      const actualTable = tableConfigs[currentTable].table || currentTable;
      const method = currentEditId ? 'PUT' : 'POST';
      const url = currentEditId ? `/api/${actualTable}/${currentEditId}` : `/api/${actualTable}`;
      
      try {
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
          showToast(currentEditId ? '✅ تم التعديل بنجاح' : '✅ تمت الإضافة بنجاح');
          closeModal();
          loadData(actualTable);
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) { showToast('❌ خطأ في الاتصال', 'error'); }
    });

    async function deleteItem(table, id, name) {
      if (!confirm(`هل أنت متأكد من حذف "${name}"؟`)) return;
      const actualTable = tableConfigs[table].table || table;
      try {
        const res = await fetch(`/api/${actualTable}/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) { 
          showToast('🗑️ تم الحذف بنجاح'); 
          loadData(actualTable); 
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) { showToast('❌ خطأ في الحذف', 'error'); }
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; 
      t.className = `toast show ${type === 'error' ? 'error' : ''}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() { 
      if(confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('user'); 
        window.location.href = '/login'; 
      }
    }

    buildSidebar();
    showPage('dashboard');
  </script>
</body>
</html>
