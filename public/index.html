<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم | مدرسة النور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .nav-item { transition: all 0.2s ease; }
    .nav-item:hover { background: rgba(255,255,255,0.08); }
    .nav-item.active { background: rgba(255,255,255,0.12); border-right: 3px solid #818cf8; }
    .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); }
    .modal.show { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease-out; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; width: 95%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .btn-primary { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; width: 100%; transition: all 0.2s; }
    @media (min-width: 640px) { .btn-primary { width: auto; } }
    .form-input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; margin-bottom: 16px; background: #f8fafc; font-size: 16px; }
    .form-input:focus { outline: none; border-color: #4f46e5; background: white; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; z-index: 2000; display: none; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    .toast.show { display: block; animation: slideDown 0.3s ease-out; }
    .toast.error { background: #ef4444; }
    @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-active { background: #ecfdf5; color: #059669; }
    .status-inactive { background: #fef2f2; color: #dc2626; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>
  
  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800"></h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 text-2xl leading-none p-2">&times;</button>
      </div>
      <form id="modal-form"></form>
    </div>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col transform translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out shadow-xl">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center">
        <div>
          <h1 class="text-lg font-extrabold text-white flex items-center gap-2"><span class="text-xl">🏫</span> مدرسة النور</h1>
          <p class="text-[10px] text-slate-500 mt-1">نظام الإدارة المتكامل</p>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-2">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      
      <nav class="mt-4 flex-1 overflow-y-auto px-3 space-y-1" id="sidebar-nav"></nav>
      
      <div class="p-4 border-t border-slate-800 bg-slate-900/50">
        <div class="flex items-center mb-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
          <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">👤</div>
          <div class="mr-3 flex-1 overflow-hidden">
            <p class="text-sm font-bold text-white truncate" id="user-name">المستخدم</p>
            <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-md font-bold" id="user-role">مدير</span>
          </div>
        </div>
        <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 py-3 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 border border-red-500/20">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          تسجيل الخروج
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-h-screen w-full">
      <!-- Top Header -->
      <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="md:hidden text-slate-600 hover:text-indigo-600 p-2">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <h2 id="page-title" class="text-lg md:text-xl font-bold text-slate-800">لوحة التحكم</h2>
        </div>
        <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 hidden sm:flex items-center gap-2" id="current-date">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
          <span></span>
        </span>
      </header>

      <!-- Dynamic Content -->
      <div id="main-content" class="p-4 md:p-8 max-w-7xl mx-auto w-full flex-1"></div>
    </main>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    if (!currentUser || !currentUser.role) window.location.href = '/login';
    const userRole = currentUser.role;
    document.querySelector('#current-date span').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // Toggle Mobile Sidebar
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('translate-x-full');
      overlay.classList.toggle('hidden');
    }

    const menuItems = {
      'مدير': [
        {id:'dashboard', icon:'📊', label:'لوحة التحكم'}, {id:'students', icon:'👥', label:'الطلاب'}, {id:'teachers', icon:'👨‍🏫', label:'المعلمون'},
        {id:'fees', icon:'💰', label:'الرسوم'}, {id:'reports', icon:'📄', label:'التقارير'}, {id:'certificates', icon:'🎓', label:'الشهادات'}
      ],
      'تسجيل الطلاب': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'},{id:'students', icon:'👥', label:'الطلاب'}],
      'الشؤون المالية': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'},{id:'fees', icon:'💰', label:'الرسوم'}]
    };

    const tableConfigs = {
      students: { title: 'الطلاب', columns: [{key:'name', label:'الاسم'}, {key:'grade', label:'الصف'}, {key:'section', label:'الشعبة'}, {key:'status', label:'الحالة'}], form: [{name:'name', label:'اسم الطالب', type:'text'}, {name:'grade', label:'الصف', type:'text'}, {name:'section', label:'الشعبة', type:'text'}, {name:'status', label:'الحالة', type:'select', options:['نشط','متوقف']}] },
      teachers: { title: 'المعلمون', columns: [{key:'name', label:'الاسم'}, {key:'subject', label:'المادة'}, {key:'phone', label:'الهاتف'}], form: [{name:'name', label:'اسم المعلم', type:'text'}, {name:'subject', label:'المادة', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}] },
      fees: { title: 'الرسوم', columns: [{key:'student_name', label:'الطالب'}, {key:'amount', label:'المبلغ'}, {key:'status', label:'الحالة'}], form: [{name:'student_name', label:'الطالب', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'status', label:'الحالة', type:'select', options:['paid','unpaid']}] }
    };

    let currentTable = null, currentEditId = null;

    function buildSidebar() {
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-role').textContent = userRole;
      const nav = document.getElementById('sidebar-nav');
      const items = menuItems[userRole] || menuItems['مدير'];
      nav.innerHTML = items.map((item, i) => 
        `<a onclick="showPage('${item.id}'); if(window.innerWidth < 768) toggleSidebar();" class="nav-item ${i===0?'active':''} flex items-center px-4 py-3 rounded-xl text-slate-300 hover:text-white">
          <span class="ml-3 text-lg">${item.icon}</span> <span class="font-medium">${item.label}</span>
        </a>`
      ).join('');
    }

    function showPage(pageId) {
      const contentDiv = document.getElementById('main-content');
      const titles = {dashboard:'لوحة التحكم', reports:'التقارير', certificates:'الشهادات'};
      document.getElementById('page-title').textContent = titles[pageId] || tableConfigs[pageId]?.title || '';

      if (pageId === 'dashboard') {
        renderDashboard();
      } else if (pageId === 'reports') {
        contentDiv.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><h3 class="text-lg font-bold mb-4">📄 التقارير</h3><a href="/api/reports/students" target="_blank" class="block bg-indigo-600 text-white p-4 rounded-xl text-center font-bold">تقرير الطلاب (PDF/Print)</a></div>`;
      } else if (pageId === 'certificates') {
        renderCertificates();
      } else if (tableConfigs[pageId]) {
        currentTable = pageId;
        const config = tableConfigs[pageId];
        contentDiv.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
              <h3 class="text-lg font-bold text-slate-800">إدارة ${config.title}</h3>
              <button onclick="openModal()" class="btn-primary flex items-center justify-center gap-2 text-sm">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> إضافة جديد
              </button>
            </div>
            <div class="overflow-x-auto -mx-4 md:mx-0">
              <table class="w-full text-sm min-w-[600px]">
                <thead class="bg-slate-50 border-b border-slate-100"><tr>
                  ${config.columns.map(c => `<th class="px-4 md:px-6 py-3 text-right font-semibold text-slate-600 whitespace-nowrap">${c.label}</th>`).join('')}
                  <th class="px-4 md:px-6 py-3 text-right font-semibold text-slate-600 whitespace-nowrap">الإجراءات</th>
                </tr></thead>
                <tbody id="dynamic-table-body" class="divide-y divide-slate-100">
                  <tr><td colspan="100" class="text-center py-12 text-slate-400">جاري التحميل...</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
        loadData(pageId);
      }
    }

    async function renderDashboard() {
      const contentDiv = document.getElementById('main-content');
      contentDiv.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl flex-shrink-0">👥</div>
            <div><p class="text-slate-500 text-xs font-medium">إجمالي الطلاب</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-students">...</p></div>
          </div>
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl flex-shrink-0">👨‍🏫</div>
            <div><p class="text-slate-500 text-xs font-medium">المعلمون</p><p class="text-2xl font-extrabold text-slate-800 mt-1" id="dash-teachers">...</p></div>
          </div>
        </div>`;
      
      const stats = [{table:'students', id:'dash-students'}, {table:'teachers', id:'dash-teachers'}];
      for (const s of stats) {
        try {
          const res = await fetch(`/api/${s.table}`);
          const data = await res.json();
          const el = document.getElementById(s.id);
          if (el && data.success) el.textContent = data.count;
        } catch(e) {}
      }
    }

    async function renderCertificates() {
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        document.getElementById('main-content').innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6">
            <h3 class="text-lg font-bold mb-4">🎓 شهادات الطلاب</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${data.data.map(s => `
                <a href="/certificate/${s.id}" target="_blank" class="bg-slate-800 text-white p-5 rounded-xl hover:bg-slate-700 transition">
                  <div class="font-bold text-lg mb-1">${s.name}</div>
                  <div class="text-sm text-slate-300 mb-3">${s.grade} - ${s.section}</div>
                  <div class="bg-white text-slate-900 px-3 py-2 rounded-lg text-sm font-bold text-center">عرض الشهادة</div>
                </a>
              `).join('')}
            </div>
          </div>`;
      } catch(e) {
        document.getElementById('main-content').innerHTML = '<div class="bg-red-50 p-6 rounded-2xl text-red-600">❌ خطأ في الاتصال</div>';
      }
    }

    async function loadData(table) {
      try {
        const res = await fetch(`/api/${table}`);
        const data = await res.json();
        const tbody = document.getElementById('dynamic-table-body');
        if (!tbody) return;
        
        if (!data.success || !data.data || data.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="100" class="text-center py-12 text-slate-400">لا توجد بيانات</td></tr>`;
          return;
        }

        const config = tableConfigs[currentTable];
        tbody.innerHTML = data.data.map(row => `
          <tr class="hover:bg-slate-50/80 transition-colors">
            ${config.columns.map(c => {
              let val = row[c.key] || '-';
              if (c.key === 'status') {
                if (val === 'نشط' || val === 'paid') val = `<span class="status-badge status-active">${val === 'نشط' ? 'نشط' : 'مدفوع'}</span>`;
                else val = `<span class="status-badge status-inactive">${val === 'متوقف' ? 'متوقف' : 'غير مدفوع'}</span>`;
              }
              return `<td class="px-4 md:px-6 py-4 text-slate-700 font-medium whitespace-nowrap">${val}</td>`;
            }).join('')}
            <td class="px-4 md:px-6 py-4 whitespace-nowrap">
              <button onclick="deleteItem('${table}', ${row.id}, '${(row.name || row.student_name || 'هذا السجل').replace(/'/g, "\\'")}')" class="bg-red-50 text-red-600 p-2 rounded-lg hover:bg-red-100 transition">🗑️</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('dynamic-table-body').innerHTML = `<tr><td colspan="100" class="text-center py-12 text-red-500">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    function openModal() {
      const config = tableConfigs[currentTable];
      document.getElementById('modal-title').textContent = `إضافة إلى: ${config.title}`;
      document.getElementById('modal-form').innerHTML = config.form.map(f => {
        if (f.type === 'select') {
          return `<label class="block text-sm font-semibold text-slate-700 mb-1.5">${f.label}</label>
                  <select name="${f.name}" class="form-input">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
        }
        return `<label class="block text-sm font-semibold text-slate-700 mb-1.5">${f.label}</label>
                <input type="${f.type}" name="${f.name}" class="form-input" placeholder="أدخل ${f.label}" required>`;
      }).join('') + `<button type="submit" class="btn-primary mt-2">💾 حفظ البيانات</button>`;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {}; formData.forEach((v, k) => data[k] = v);
      try {
        const res = await fetch(`/api/${currentTable}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
          showToast('✅ تمت الإضافة بنجاح');
          closeModal();
          loadData(currentTable);
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) { showToast('❌ خطأ في الاتصال', 'error'); }
    });

    async function deleteItem(table, id, name) {
      if (!confirm(`حذف "${name}"؟`)) return;
      try {
        const res = await fetch(`/api/${table}/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) { showToast('🗑️ تم الحذف'); loadData(table); }
        else showToast('❌ ' + result.message, 'error');
      } catch (err) { showToast('❌ خطأ', 'error'); }
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast show ${type === 'error' ? 'error' : ''}`;
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() { 
      if(confirm('تسجيل الخروج؟')) { localStorage.removeItem('user'); window.location.href = '/login'; }
    }

    buildSidebar();
    showPage('dashboard');
  </script>
</body>
</html>
